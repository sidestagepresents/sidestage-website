backend:
  name: github
  repo: sidestagepresents/sidestage-website
  branch: main
  base_url: https://sidestage-decap-oauth.patient-shadow-6c5f.workers.dev
  auth_endpoint: auth

media_folder: "src/img"
public_folder: "/img"

collections:
  - name: "artists"
    label: "Artists"
    folder: "src/artists"
    create: true
    slug: "{{slug}}"
    identifier_field: name
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Photo", name: "image", widget: "image", required: false }
      - { label: "Bio", name: "body", widget: "markdown" }
      - label: "Socials"
        name: "socials"
        widget: "object"
        required: false
        fields:
          - { label: "Instagram", name: "instagram", widget: "string", required: false }
          - { label: "X", name: "x", widget: "string", required: false }
          - { label: "TikTok", name: "tiktok", widget: "string", required: false }
          - { label: "Spotify", name: "spotify", widget: "string", required: false }
          - { label: "YouTube", name: "youtube", widget: "string", required: false }
          - { label: "Website", name: "website", widget: "string", required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false, required: false, hint: "Hide this artist from the site" }
  - name: "events"
    label: "Events"
    folder: "src/events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: artist
    summary: "{{artist}} · {{city}} — {{date | date('MMM D, YYYY')}}"
    sortable_fields: ["date", "city", "artist"]
    fields:
      - { label: "Artist", name: "artist", widget: "string" }
      - { label: "Event title (tour)", name: "title", widget: "string", required: false }
      - { label: "City", name: "city", widget: "string" }
      - { label: "Venue", name: "venue", widget: "string" }
      - label: "Date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
      - label: "Publish at"
        name: "publish_at"
        widget: "datetime"
        required: false
        hint: "Optional: keep this event hidden until this date/time (Toronto time). Goes live automatically."
      - { label: "Flyer image", name: "image", widget: "image", required: false }
      - { label: "Ticket link", name: "ticket_link", widget: "string", required: false }
      - { label: "Sold out", name: "sold_out", widget: "boolean", default: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false, required: false, hint: "Hide this event from the site" }
  - name: "pages"
    label: "Pages"
    files:
      - label: "About"
        name: "about"
        file: "src/about.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
          - { label: "Draft", name: "draft", widget: "boolean", default: false, required: false, hint: "Hide this page from the site" }
          - { label: "Show in menu", name: "show_in_nav", widget: "boolean", default: true, required: false }
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "General, Socials & Sharing"
        name: "general"
        file: "src/_data/settings.json"
        fields:
          - { label: "Site name", name: "site_name", widget: "string" }
          - { label: "Site URL", name: "site_url", widget: "string", hint: "No trailing slash. Used for share links." }
          - { label: "Instagram URL", name: "instagram_url", widget: "string", required: false }
          - { label: "Facebook URL", name: "facebook_url", widget: "string", required: false }
          - { label: "X URL", name: "x_url", widget: "string", required: false }
          - { label: "TikTok URL", name: "tiktok_url", widget: "string", required: false }
          - { label: "YouTube URL", name: "youtube_url", widget: "string", required: false }
          - { label: "SEO title", name: "seo_title", widget: "string", hint: "Homepage title shown in Google and when sharing" }
          - { label: "Meta description", name: "seo_description", widget: "text", hint: "Short description shown in Google and when sharing" }
          - { label: "Default share image", name: "og_image", widget: "image", required: false, hint: "Image shown when sharing the homepage (event pages use their flyer)" }
