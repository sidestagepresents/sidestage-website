backend:
  name: github
  repo: sidestagepresents/sidestage-website
  branch: main
  base_url: https://sidestage-decap-oauth.patient-shadow-6c5f.workers.dev
  auth_endpoint: auth

media_folder: "src/img"
public_folder: "/img"

collections:
  - name: "artists"
    label: "Artists"
    folder: "src/artists"
    create: true
    slug: "{{slug}}"
    identifier_field: name
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Photo", name: "image", widget: "image", required: false }
      - { label: "Bio", name: "body", widget: "markdown" }
      - label: "Socials"
        name: "socials"
        widget: "object"
        required: false
        fields:
          - { label: "Instagram", name: "instagram", widget: "string", required: false }
          - { label: "X", name: "x", widget: "string", required: false }
          - { label: "TikTok", name: "tiktok", widget: "string", required: false }
          - { label: "Spotify", name: "spotify", widget: "string", required: false }
          - { label: "YouTube", name: "youtube", widget: "string", required: false }
          - { label: "Website", name: "website", widget: "string", required: false }
  - name: "events"
    label: "Events"
    folder: "src/events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: artist
    summary: "{{artist}} · {{city}} — {{date | date('MMM D, YYYY')}}"
    sortable_fields: ["date", "city", "artist"]
    fields:
      - { label: "Artist", name: "artist", widget: "string" }
      - { label: "Event title (tour)", name: "title", widget: "string", required: false }
      - { label: "City", name: "city", widget: "string" }
      - { label: "Venue", name: "venue", widget: "string" }
      - label: "Date"
        name: "date"
        widget: "date"
        format: "YYYY-MM-DD"
      - { label: "Flyer image", name: "image", widget: "image", required: false }
      - { label: "Ticket link", name: "ticket_link", widget: "string", required: false }
      - { label: "Sold out", name: "sold_out", widget: "boolean", default: false }
  - name: "pages"
    label: "Pages"
    files:
      - label: "About"
        name: "about"
        file: "src/about.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
