<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Content Manager — Sidestage Presents</title>
</head>
<body>
<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
<script>
/*
 * Adds a site link to the Decap CMS top bar, styled like the Contents / Media
 * buttons (icon + title) so it lines up with them. Label comes from this
 * page's <title> ("Content Manager — <Site Name>"). Links to the site root in
 * a new tab, so it keeps working after the production domain cutover.
 */
(function () {
  var LINK_ID = "decap-site-name-link";
  function siteName() {
    var parts = document.title.split("—");
    return (parts.length > 1 ? parts.pop() : document.title).trim();
  }
  function inject() {
    if (document.getElementById(LINK_ID)) return true;
    var header = document.querySelector("#nc-root header");
    if (!header) return false;

    var link = document.createElement("a");
    link.id = LINK_ID;
    link.href = new URL("/", window.location.href).href;
    link.target = "_blank";
    link.rel = "noopener";
    link.title = "View site";

    // External-link icon, matching the button-icon look of Contents / Media.
    var NS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("width", "20");
    svg.setAttribute("height", "20");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("fill", "none");
    svg.setAttribute("stroke", "currentColor");
    svg.setAttribute("stroke-width", "2");
    svg.setAttribute("stroke-linecap", "round");
    svg.setAttribute("stroke-linejoin", "round");
    svg.setAttribute("aria-hidden", "true");
    [["M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"],
     ["M15 3h6v6"],
     ["M10 14 21 3"]].forEach(function (d) {
      var p = document.createElementNS(NS, "path");
      p.setAttribute("d", d[0]);
      svg.appendChild(p);
    });

    var label = document.createElement("span");
    label.textContent = siteName();

    link.appendChild(svg);
    link.appendChild(label);

    // Same shape as the Contents / Media nav buttons: icon + title, centered.
    link.style.cssText =
      "display:inline-flex;align-items:center;gap:8px;margin:0 4px 0 0;padding:8px 12px;" +
      "font-size:14px;font-weight:500;color:#798291;text-decoration:none;white-space:nowrap;" +
      "font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;";

    var buttons = Array.prototype.filter.call(
      header.querySelectorAll("button, a"),
      function (el) {
        var t = el.textContent.trim();
        return t === "Contents" || t === "Media";
      }
    );
    if (buttons.length) {
      var first = buttons[0];
      first.parentNode.insertBefore(link, first);
    } else {
      header.appendChild(link);
    }
    return true;
  }
  if (!inject()) {
    var observer = new MutationObserver(function () {
      if (inject()) observer.disconnect();
    });
    observer.observe(document.documentElement, { childList: true, subtree: true });
  }
})();
</script>
</body>
</html>
