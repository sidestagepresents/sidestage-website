<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Content Manager — Sidestage Presents</title>
</head>
<body>
<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
<script>
/*
 * Adds a "Sidestage Presents" link to the Decap CMS top bar, placed with the
 * Contents / Media buttons (Decap has no built-in site link).
 * Uses the current origin so it keeps working after the production domain cutover.
 */
(function () {
  var LINK_ID = "decap-site-name-link";
  function inject() {
    if (document.getElementById(LINK_ID)) return true;
    var header = document.querySelector("#nc-root header");
    if (!header) return false;
    var link = document.createElement("a");
    link.id = LINK_ID;
    link.href = new URL("/", window.location.href).href;
    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = "Sidestage Presents";
    link.title = "View site";
    link.style.cssText =
      "margin:0 4px 0 0;padding:8px 12px;font-size:14px;font-weight:600;" +
      "color:#3a3a3a;text-decoration:none;white-space:nowrap;align-self:center;" +
      "font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;";
    // Put it with the Contents / Media menu buttons when we can find them.
    var buttons = Array.prototype.filter.call(
      header.querySelectorAll("button, a"),
      function (el) {
        var t = el.textContent.trim();
        return t === "Contents" || t === "Media";
      }
    );
    if (buttons.length) {
      var first = buttons[0];
      first.parentNode.insertBefore(link, first);
    } else {
      header.appendChild(link);
    }
    return true;
  }
  if (!inject()) {
    var observer = new MutationObserver(function () {
      if (inject()) observer.disconnect();
    });
    observer.observe(document.documentElement, { childList: true, subtree: true });
  }
})();
</script>
</body>
</html>
